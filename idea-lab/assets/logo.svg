<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Idea Lab">
  <defs>
    <linearGradient id="il-cosmos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ee0ff"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff6ea9"/>
    </linearGradient>
    <radialGradient id="il-planet" cx="0.36" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#c7f2ff"/>
      <stop offset="0.5" stop-color="#3aa0ff"/>
      <stop offset="1" stop-color="#1b3fb0"/>
    </radialGradient>
    <linearGradient id="il-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- glass flask -->
  <path d="M26 10 L38 10 L38 22 L53 52 a3 3 0 0 1 -2.7 4.3 L13.7 56.3 a3 3 0 0 1 -2.7 -4.3 L26 22 Z"
        fill="url(#il-glass)" stroke="#bfeaff" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- cosmic liquid -->
  <path d="M19.5 38 L44.5 38 L51 52 a3 3 0 0 1 -2.7 4.3 L15.7 56.3 a3 3 0 0 1 -2.7 -4.3 Z"
        fill="url(#il-cosmos)"/>

  <!-- ringed planet inside -->
  <g transform="rotate(-18 32 47)">
    <ellipse cx="32" cy="47" rx="11" ry="3.4" fill="none" stroke="#ffd76a" stroke-width="1.8"/>
    <circle cx="32" cy="47" r="6.2" fill="url(#il-planet)"/>
  </g>

  <!-- neck collar -->
  <rect x="24.4" y="7.4" width="15.2" height="3.4" rx="1.7" fill="#cde7ff"/>

  <!-- sparkles -->
  <path d="M45 14 l1 2.7 2.7 1 -2.7 1 -1 2.7 -1 -2.7 -2.7 -1 2.7 -1 Z" fill="#ffffff" opacity="0.92"/>
  <circle cx="21.5" cy="30" r="1.15" fill="#ffffff" opacity="0.8"/>
  <circle cx="41" cy="33" r="1" fill="#ffffff" opacity="0.7"/>
</svg>
