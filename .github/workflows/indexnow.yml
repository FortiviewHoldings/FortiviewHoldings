name: IndexNow

# Tell Bing (and the other participating engines) what changed, instead of
# waiting to be crawled. Bing's index feeds ChatGPT and Copilot, so this is
# the fast path into AI answers. Google does not participate in IndexNow —
# Search Console covers that side.
#
# Fires after each successful deploy, because the sitemap is generated at
# build time and only exists on the live site — announcing before the deploy
# lands would submit the previous deploy's URL list.
#
# The weekly run is the backstop: if a submission fails while nobody is
# looking, Sunday picks it up. The script reads the live sitemap, so a
# no-op week costs one API call.

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  schedule:
    # Sundays, 07:00 UTC. Catches anything a push missed.
    - cron: '0 7 * * 0'
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL in the sitemap, not just recent ones'
        type: boolean
        default: false
      days:
        description: 'How many days back to count as recent'
        type: string
        default: '7'

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    # Skip when the deploy it rode in on failed; scheduled/manual runs pass.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The script polls until the key file is served from the live site,
      # because this job starts before the Pages build has finished.
      - name: Submit changed URLs
        env:
          INDEXNOW_ATTEMPTS: '20'
          INDEXNOW_GAP_MS: '15000'
        run: |
          # A scheduled or push run carries no inputs, so both fall through to
          # --days and the script works out what actually changed recently.
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs --days "${{ github.event.inputs.days || '7' }}"
          fi
