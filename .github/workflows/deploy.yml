# Deploy the React build (SSG) to GitHub Pages from the react-conversion branch.
# main is untouched: to roll back, set Pages back to "Deploy from branch: main"
# (or: gh api -X PUT repos/OWNER/REPO/pages -f build_type=legacy
#  -f source[branch]=main -f source[path]=/) and the old site rebuilds.
name: deploy

on:
  push:
    branches: [react-conversion]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (client + SSR + prerender + static)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
